[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-system"
version = "0.1.0"
description = "Sentiment analysis dashboard with a Python FastAPI backend and a React frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "openpyxl",
    "pypdf",
    "python-multipart",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
